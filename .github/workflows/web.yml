name: Deploy Web

# Publica la app como sitio web para abrirla desde cualquier telefono,
# incluido iPhone: Safari -> Compartir -> Anadir a pantalla de inicio.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold web
        run: |
          flutter create . --project-name solarscan --platforms=web
          # flutter create pisa lib/, pubspec.yaml y web/index.html:
          # restauramos los nuestros (iconos, splash y metadatos de iOS).
          git checkout -- lib pubspec.yaml web

      - run: flutter pub get

      # OJO: base-href debe coincidir con el nombre del repositorio.
      - run: flutter build web --release --base-href "/solarscan/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
